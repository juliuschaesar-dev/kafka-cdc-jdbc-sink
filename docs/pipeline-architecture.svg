  <rect width="1600" height="700" fill="#fbfbfc"/>

  <text x="800" y="36" font-size="26" font-weight="700" fill="#1a1a2e" text-anchor="middle">PostgreSQL &#8594; Kafka Connect &#8594; ClickHouse CDC Pipeline</text>
  <text x="800" y="58" font-size="14" fill="#666" text-anchor="middle">docker-compose services and data flow &#8212; kafka-cdc-jdbc-sink</text>

  <!-- ============ cross-cutting bus ============ -->
  <line x1="430" y1="185" x2="1310" y2="185" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="430" y1="185" x2="430" y2="258" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-gray)"/>
  <line x1="720" y1="185" x2="720" y2="258" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-gray)"/>
  <line x1="1010" y1="185" x2="1010" y2="258" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-gray)"/>
  <line x1="1310" y1="185" x2="1310" y2="258" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-gray)"/>
  <line x1="575" y1="160" x2="575" y2="185" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="1160" y1="160" x2="1160" y2="185" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Schema Registry box -->
  <rect x="460" y="90" width="230" height="70" rx="12" fill="#ffffff" stroke="#1E88E5" stroke-width="2"/>
  <use href="#i-schema" x="474" y="98" width="30" height="30"/>
  <text x="514" y="115" font-size="15" font-weight="700" fill="#1a1a2e">Schema Registry</text>
  <text font-size="11" fill="#555">
    <tspan x="474" y="138">Confluent &#183; Avro schemas</tspan>
    <tspan x="474" y="150">for source &amp; sink connectors</tspan>
  </text>

  <!-- AKHQ box -->
  <rect x="1055" y="90" width="210" height="70" rx="12" fill="#ffffff" stroke="#009688" stroke-width="2"/>
  <use href="#i-akhq" x="1069" y="98" width="30" height="30"/>
  <text x="1109" y="115" font-size="15" font-weight="700" fill="#1a1a2e">AKHQ</text>
  <text font-size="11" fill="#555">
    <tspan x="1069" y="138">browse topics, consumer</tspan>
    <tspan x="1069" y="150">groups, schemas, Connect</tspan>
  </text>

  <!-- ============ main pipeline row ============ -->

  <!-- A: Postgres source -->
  <rect x="40" y="260" width="220" height="130" rx="14" fill="#ffffff" stroke="#336791" stroke-width="2"/>
  <use href="#i-db" x="54" y="274" width="34" height="34"/>
  <text x="98" y="296" font-size="15" font-weight="700" fill="#1a1a2e">PostgreSQL</text>
  <text font-size="11" fill="#555">
    <tspan x="54" y="322">source: cdc_db</tspan>
    <tspan x="54" y="335">customers &#183; orders</tspan>
    <tspan x="54" y="348">REPLICA IDENTITY FULL</tspan>
    <tspan x="54" y="361">wal_level=logical</tspan>
  </text>

  <!-- B: Kafka Connect - Debezium source -->
  <rect x="300" y="260" width="260" height="130" rx="14" fill="#ffffff" stroke="#5b5b8a" stroke-width="2"/>
  <use href="#i-kafka" x="314" y="274" width="34" height="34"/>
  <text x="358" y="296" font-size="15" font-weight="700" fill="#1a1a2e">Kafka Connect</text>
  <text font-size="11" fill="#555">
    <tspan x="314" y="322">Debezium Postgres connector</tspan>
    <tspan x="314" y="335">unwrap SMT &#8594; flat rows</tspan>
    <tspan x="314" y="348">topics: pg1.public.*</tspan>
  </text>

  <!-- C: Kafka CDC topics -->
  <rect x="620" y="260" width="200" height="130" rx="14" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <use href="#i-kafka" x="634" y="274" width="34" height="34"/>
  <text x="678" y="296" font-size="15" font-weight="700" fill="#1a1a2e">Kafka</text>
  <text font-size="11" fill="#555">
    <tspan x="634" y="322">CDC topics (Avro):</tspan>
    <tspan x="634" y="335">pg1.public.customers,</tspan>
    <tspan x="634" y="348">pg1.public.orders</tspan>
  </text>

  <!-- D: Kafka Connect - JDBC sink -->
  <rect x="880" y="260" width="260" height="130" rx="14" fill="#ffffff" stroke="#5b5b8a" stroke-width="2"/>
  <use href="#i-kafka" x="894" y="274" width="34" height="34"/>
  <text x="938" y="296" font-size="15" font-weight="700" fill="#1a1a2e">Kafka Connect</text>
  <text font-size="11" fill="#555">
    <tspan x="894" y="322">Confluent JDBC sink connector</tspan>
    <tspan x="894" y="335">insert.mode=insert</tspan>
    <tspan x="894" y="348">TimestampConverter SMTs</tspan>
  </text>

  <!-- E: ClickHouse -->
  <rect x="1200" y="260" width="220" height="130" rx="14" fill="#ffffff" stroke="#FFCC01" stroke-width="2"/>
  <use href="#i-clickhouse" x="1214" y="274" width="34" height="34"/>
  <text x="1258" y="296" font-size="15" font-weight="700" fill="#1a1a2e">ClickHouse</text>
  <text font-size="11" fill="#555">
    <tspan x="1214" y="322">ReplacingMergeTree(__ts_ms)</tspan>
    <tspan x="1214" y="335">customers_latest /</tspan>
    <tspan x="1214" y="348">orders_latest views</tspan>
    <tspan x="1214" y="361">(FINAL, filter __deleted)</tspan>
  </text>

  <!-- main flow arrows -->
  <line x1="260" y1="325" x2="298" y2="325" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="279" y="315" font-size="10" fill="#333" text-anchor="middle">WAL</text>

  <line x1="560" y1="325" x2="618" y2="325" stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow)"/>
